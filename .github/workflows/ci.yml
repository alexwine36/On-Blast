name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx biome ci .

      # No asset staging here: typecheck, tests and the bundle build all work
      # without the 42 MB of MediaPipe wasm. Only the Pages deploy needs it.
      - name: Typecheck, test, build
        run: bunx turbo run typecheck test build
